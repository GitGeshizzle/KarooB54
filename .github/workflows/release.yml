name: Release

# Push a tag like v0.1.0 and this builds the APK and publishes a GitHub Release with it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify signing secrets are present
        # Fail fast (before the build) so a tag can never produce an unsigned, uninstallable
        # release when the keystore secrets are missing.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release signing secret(s):$missing — add them under Settings > Secrets and variables > Actions before tagging a release."
            exit 1
          fi
          echo "All signing secrets present."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Decode signing keystore
        # KEYSTORE_BASE64 is the base64 of your release .jks, stored as an Actions secret.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        # Authenticate to GitHub Packages for karoo-ext (see ci.yml); sign with the keystore
        # decoded above (see app/build.gradle.kts for how these env vars are consumed).
        env:
          GITHUB_USER: GitGeshizzle
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK to KarooB54-<tag>.apk
        run: cp app/build/outputs/apk/release/app-release.apk "KarooB54-${GITHUB_REF_NAME}.apk"

      - name: Generate manifest.json
        # The Karoo reads this (via MANIFEST_URL in AndroidManifest.xml) to offer updates.
        # latestVersionCode MUST match the APK's versionCode (see app/build.gradle.kts:
        # major*10000 + minor*100 + patch) so update detection works.
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          VERSION_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          jq -n \
            --arg label "KarooB54" \
            --arg packageName "io.github.gitgeshizzle.karoob54" \
            --arg latestApkUrl "${REPO_URL}/releases/download/${TAG}/KarooB54-${TAG}.apk" \
            --arg latestVersion "${VERSION}" \
            --argjson latestVersionCode "${VERSION_CODE}" \
            --arg iconUrl "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/docs/icon.png" \
            --arg developer "GitGeshizzle" \
            --arg description "Shows your Supernova B54 bike-light battery, remaining runtime, voltage, temperature and charge cycles as Karoo data fields over BLE (read-only)." \
            '{label:$label, packageName:$packageName, latestApkUrl:$latestApkUrl, latestVersion:$latestVersion, latestVersionCode:$latestVersionCode, iconUrl:$iconUrl, developer:$developer, description:$description}' \
            > manifest.json
          cat manifest.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "KarooB54-${GITHUB_REF_NAME}.apk" \
            manifest.json \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
