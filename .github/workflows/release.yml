name: Release

# Push a tag like v0.1.0 and this builds the APK and publishes a GitHub Release with it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Build APK
        # Authenticate to GitHub Packages for karoo-ext (see ci.yml).
        env:
          GITHUB_USER: GitGeshizzle
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK to KarooB54-<tag>.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk "KarooB54-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "KarooB54-${GITHUB_REF_NAME}.apk" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
