name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Test & build
        # settings.gradle.kts reads these env vars to authenticate to GitHub Packages
        # (karoo-ext). The built-in GITHUB_TOKEN can read public packages; if it can't,
        # create a PAT with read:packages, store it as the secret GH_PACKAGES_TOKEN, and
        # swap GITHUB_TOKEN below for ${{ secrets.GH_PACKAGES_TOKEN }}.
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:test :app:assembleDebug --no-daemon
